name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node dist/bin.js --version

  # The Pi SDK is a peer dependency: the adapter runs on the Pi the user
  # installed. The suite therefore runs against the lowest and the latest
  # supported Pi versions.
  pi-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lowest supported, and the newest release inside the supported range
        pi: ["1.3.0", "^1.3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the Pi version under test
        run: npm install --no-save --no-package-lock "@earendil-works/pi-coding-agent@${{ matrix.pi }}"
      - name: Show the Pi family under test
        run: npm ls @earendil-works/pi-coding-agent @earendil-works/pi-codemode
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/bin.js --version

  # Version bumps must name every PR merged since the previous tag, keep the
  # lockfile in sync, and stay on patch unless labeled release:minor / release:major.
  # Other PRs only get a notice listing unreleased PRs on the base branch.
  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch and tags
        run: git fetch origin "${{ github.base_ref }}" --tags --force
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release metadata
        run: bash scripts/release-check
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
